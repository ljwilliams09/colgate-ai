<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Network Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Chrome Extension</p>
          <h1>Network Capture</h1>
          <p class="lede">
            Inspect browser requests and responses from the current tab or the
            full browser.
          </p>
        </div>
        <div class="status-card">
          <span class="status-dot"></span>
          <span id="active-tab-label">Active tab</span>
        </div>
      </header>

      <section class="toolbar">
        <button
          id="refresh-button"
          class="button button-secondary"
          type="button"
        >
          Refresh
        </button>
        <button id="clear-button" class="button button-primary" type="button">
          Clear history
        </button>
      </section>

      <section class="stats" aria-live="polite">
        <div class="stat">
          <span class="stat-label">Captured</span>
          <strong id="captured-count">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Visible</span>
          <strong id="visible-count">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Filter</span>
          <strong id="filter-label">Active tab</strong>
        </div>
      </section>

      <section class="live-analytics" aria-live="polite">
        <div class="live-header">
          <p class="live-title">Live Analytics (60s)</p>
          <span id="stream-status" class="stream-status">Connecting</span>
        </div>
        <div class="live-grid">
          <div class="stat">
            <span class="stat-label">Req/sec</span>
            <strong id="rate-label">0.00</strong>
          </div>
          <div class="stat">
            <span class="stat-label">Error rate</span>
            <strong id="error-rate-label">0.0%</strong>
          </div>
          <div class="stat">
            <span class="stat-label">Window events</span>
            <strong id="window-total-label">0</strong>
          </div>
        </div>
        <ul id="top-hosts" class="top-hosts" aria-label="Top domains"></ul>
      </section>

      <section class="log-panel">
        <div id="empty-state" class="empty-state">
          No network events captured yet.
        </div>
        <ul id="log-list" class="log-list" aria-label="Network requests"></ul>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
