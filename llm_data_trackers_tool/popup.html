<!-- popup.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fafaf9;
      color: #1c1917;
    }

    /* ── Header stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: #fff;
      border: 1px solid #e7e5e4;
      border-radius: 10px;
      padding: 10px;
    }
    .stat-card .label {
      font-size: 11px;
      color: #78716c;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .stat-card .value       { font-size: 22px; font-weight: 700; color: #1c1917; }
    .stat-card .value.alert { color: #e25c1e; }

    /* ── Alert banner ── */
    .alert {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 10px;
      padding: 11px 13px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #9a3412;
      line-height: 1.5;
    }

    /* ── Platform section ── */
    .platform { margin-bottom: 14px; }

    .platform-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .platform-name {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 15px;
      font-weight: 700;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-claude  { background: #e25c1e; }
    .dot-chatgpt { background: #3b82f6; }
    .platform-pings { font-size: 12px; color: #78716c; }

    /* ── Group label ── */
    .group-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #a8a29e;
      margin: 10px 0 5px;
    }

    /* ── Tracker card ── */
    .tracker-card {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid #f5f5f4;
    }
    .tracker-card:last-child { border-bottom: none; }

    .tracker-name { font-size: 13px; font-weight: 600; }
    .tracker-desc { font-size: 12px; color: #78716c; margin-top: 1px; }

    .tracker-meta { text-align: right; flex-shrink: 0; }
    .timing-badge {
      display: inline-block;
      background: #fee2e2;
      color: #dc2626;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 3px;
    }
    .timing-badge.after {
      background: #dcfce7;
      color: #16a34a;
    }
    .call-count { font-size: 11px; color: #a8a29e; }

    /* ── Empty state ── */
    .empty { font-size: 13px; color: #a8a29e; padding: 6px 0; }

    /* ── Footer ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e7e5e4;
    }
    .footer-time { font-size: 11px; color: #a8a29e; }
    .clear-btn {
      font-size: 12px;
      border: 1px solid #d6d3d1;
      border-radius: 8px;
      padding: 5px 12px;
      background: #fff;
      cursor: pointer;
      color: #1c1917;
    }
    .clear-btn:hover { background: #f5f5f4; }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="label">Notified before you typed</div>
      <div class="value alert" id="before-count">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Total pings</div>
      <div class="value" id="total-pings">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Companies involved</div>
      <div class="value" id="companies-count">—</div>
    </div>
  </div>

  <div class="alert hidden" id="alert-banner"></div>

  <div id="platforms"></div>

  <div class="footer">
    <span class="footer-time" id="session-time">No session yet</span>
    <button class="clear-btn" id="clear-btn">Clear log</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
